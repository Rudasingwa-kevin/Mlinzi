# Render Blueprint — one-click deploy
# https://render.com/docs/blueprint-spec
# NOTE: Create PostgreSQL database manually first, then paste its Internal URL as DATABASE_URL

services:
  # ── Backend API ──
  - type: web
    name: mlinzi-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # paste your Render PostgreSQL Internal URL here
      - key: CLIENT_URL
        sync: false  # set after Vercel deploy
      - key: JWT_SECRET
        generateValue: true
      - key: ZEN_API_KEY
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_USERNAME
        value: sandbox
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: mlinzi_webhook_verify
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_NAME
        value: Mlinzi
      - key: RETENTION_DAYS
        value: "90"
      - key: MAX_FILE_SIZE
        value: "5242880"
