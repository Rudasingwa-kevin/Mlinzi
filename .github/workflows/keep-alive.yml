name: Keep Alive

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mlinzi-api.onrender.com/)
          echo "Health check returned: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Render did not respond with 200"
            exit 1
          fi
